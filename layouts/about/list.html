{{ define "main" }}

<article class="cf ph3 ph5-l pv4 pv5-l center">
  <h1 class="f1 fw8 mt0 mb4">{{ .Title }}</h1>
  
  <!-- Profile Photo -->
  <div class="mb5 tc">
    <img src="/about/pic.jpg" alt="{{ .Title }}" class="br-100 w-20 h-20 object-cover ba b--light-gray shadow-1">
  </div>

  <!-- Main content -->
  <div class="mw7 center f5 lh-copy">
    {{ .Content }}
  </div>
</article>

{{ end }}
